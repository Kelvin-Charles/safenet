# Meraki cloud IPv6 prefix (eu-central / n260 shard).
# Only takes effect if FreeRADIUS is bound to an IPv6 socket AND the host has
# a globally-routable IPv6 address. Harmless to leave configured otherwise.
client MX674_v6 {
    ipv6addr = 2606:7bc0::/32
    secret = SiriNywila321
    require_message_authenticator = no
    nas_type = other
    shortname = MX674_v6
}

# ---------------------------------------------------------------------------
# TP-Link TL-WR841N (SSID TP-LINK_D1DD) — WPA/WPA2-Enterprise.
# ISP assigns a dynamic WAN IP in 196.249.x.x (seen: .123.134, .122.156).
# Use the whole /16 so RADIUS keeps working when the public IP changes.
# Still protected by the shared secret; tighten the CIDR if the ISP publishes
# a smaller allocation, or get a static IP from the ISP.
# ---------------------------------------------------------------------------
client tp_link_wr841n {
    ipaddr = 196.249.0.0/16
    secret = SiriNywila321
    require_message_authenticator = no
    nas_type = other
    shortname = tp_link_wr841n
}

# Additional NAS devices are added via the web interface
# and stored in the database (nas table)
# FreeRADIUS will read them from SQL automatically
