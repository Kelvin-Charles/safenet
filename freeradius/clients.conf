# FreeRADIUS Clients Configuration
# Network Access Servers (NAS) are configured here
# This file is dynamically managed by the web interface

# Localhost for testing
client localhost {
    ipaddr = 127.0.0.1
    secret = testing123
    require_message_authenticator = no
    nas_type = other
}

# Docker network
client docker_network {
    ipaddr = 172.20.0.0/16
    secret = testing123
    require_message_authenticator = no
    nas_type = other
}

# Additional NAS devices are added via the web interface
# and stored in the database (nas table)
# FreeRADIUS will read them from SQL automatically


