# FreeRADIUS Clients Configuration
# Network Access Servers (NAS) are configured here
# This file is dynamically managed by the web interface

# Localhost for testing
client localhost {
    ipaddr = 127.0.0.1
    secret = testing123
    require_message_authenticator = no
    nas_type = other
}

# Docker default bridge networks. The compose project uses 172.18.0.0/16
# (verify with `docker network inspect safenet_safenet-network`).
client docker_network_18 {
    ipaddr = 172.18.0.0/16
    secret = testing123
    require_message_authenticator = no
    nas_type = other
}

client docker_network_20 {
    ipaddr = 172.20.0.0/16
    secret = testing123
    require_message_authenticator = no
    nas_type = other
}

# Temporary external test client (e.g. your laptop's public IP). Remove or
# narrow once real NAS clients are configured in the web UI / nas table.
client lab_workstation {
    ipaddr = 102.211.196.168
    secret = SiriNywila321
    require_message_authenticator = no
    nas_type = other
}

# ---------------------------------------------------------------------------
# Cisco Meraki cloud (n260 / eu-central shard).
# Source ranges from your dashboard at Help -> Firewall info.
# Use the SAME secret you configure for the RADIUS server in Meraki dashboard.
# Replace MERAKI_SECRET below with a long random value (do not commit secrets).
# ---------------------------------------------------------------------------
client meraki_n260_a {
    ipaddr = 64.62.142.12/32
    secret = MERAKI_SECRET
    require_message_authenticator = no
    nas_type = other
    shortname = meraki_n260_a
}
client meraki_n260_b {
