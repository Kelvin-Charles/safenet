services:
  # MariaDB Database (listens on 3302 so host 3306 is free for another service)
  db:
    image: mariadb:10.11
    container_name: safenet-db
    restart: unless-stopped
    command: ["mariadbd", "--port=3302"]
    environment:
      # Required: MariaDB refuses uninitialized root; never use empty passwords.
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${DB_NAME:-radius}
      MYSQL_USER: ${DB_USER:-radius}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "3302:3302"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    networks:
      - safenet-network
    healthcheck:
      # Use container env so passwords with special chars work and match MYSQL_ROOT_PASSWORD.
      test:
        [
          "CMD-SHELL",
          'mysqladmin ping -h localhost --port=3302 -u root -p"$$MYSQL_ROOT_PASSWORD" || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # phpMyAdmin - Database Management Interface
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: safenet-phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      TZ: ${TZ:-Africa/Nairobi}
      PMA_HOST: db
      PMA_PORT: 3302
      PMA_USER: ${DB_USER:-radius}
      PMA_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
      UPLOAD_LIMIT: 300M
      MAX_EXECUTION_TIME: 600
    depends_on:
      db:
        condition: service_healthy
    networks:
      - safenet-network

  # Flask Web Application
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: safenet-web
    restart: unless-stopped
    ports:
      - "0.0.0.0:5001:5001"     # Listen on all interfaces so reachable at server IP (e.g. 159.198.40.102:5001)
    environment:
      TZ: ${TZ:-Africa/Nairobi}
      # Meraki CoA (Change of Authorization / Disconnect)
      MERAKI_COA_HOST: ${MERAKI_COA_HOST:-n260.meraki.com}
      MERAKI_COA_PORT: ${MERAKI_COA_PORT:-3799}
      MERAKI_COA_SECRET: ${MERAKI_COA_SECRET:-JRIIT-fr33.}
      FLASK_APP: app.py
      FLASK_ENV: ${FLASK_ENV:-production}
      SECRET_KEY: ${SECRET_KEY:-change-this-to-a-random-secret-key}
      DB_HOST: db
      DB_PORT: 3302            # internal DB port
      DB_NAME: ${DB_NAME:-radius}
      DB_USER: ${DB_USER:-radius}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      RADIUS_SECRET: ${RADIUS_SECRET:-testing123}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123@SafeNet}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-meenacharles22@gmail.com}
      # Bandwidth alert email (SMTP - e.g. mail.safezonetz.com)
      MAIL_SERVER: ${MAIL_SERVER:-mail.safezonetz.com}
      MAIL_PORT: ${MAIL_PORT:-465}
      MAIL_USE_SSL: ${MAIL_USE_SSL:-true}
      MAIL_USERNAME: ${MAIL_USERNAME:-safenet@safezonetz.com}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-NEcEtmsvEc54}
      MAIL_DEFAULT_SENDER: ${MAIL_DEFAULT_SENDER:-safenet@safezonetz.com}
      BANDWIDTH_ALERT_FALLBACK_EMAIL: ${BANDWIDTH_ALERT_FALLBACK_EMAIL:-}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - safenet-network
    volumes:
      - radius_logs:/var/log/freeradius:ro
    command: >
      sh -c "
        echo 'Waiting for database...' &&
        sleep 10 &&
        flask init-db &&
        gunicorn --bind 0.0.0.0:5001 --workers 4 --timeout 120 app:app
      "

  # FreeRADIUS Server
  freeradius:
    build:
      context: .
      dockerfile: freeradius/Dockerfile
    container_name: safenet-radius
    restart: unless-stopped
    ports:
      - "1812:1812/udp"  # RADIUS Authentication
      - "1813:1813/udp"  # RADIUS Accounting
    environment:
      TZ: ${TZ:-Africa/Nairobi}
      DB_HOST: db
      DB_PORT: 3302
      DB_NAME: ${DB_NAME:-radius}
      DB_USER: ${DB_USER:-radius}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      RADIUS_SECRET: ${RADIUS_SECRET:-testing123}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - safenet-network
    volumes:
      - ./freeradius/clients.conf:/etc/freeradius/3.0/clients.conf:ro
      - ./freeradius/radiusd.conf:/etc/freeradius/3.0/radiusd.conf:ro
      - ./freeradius/mods-available/sql.template:/etc/freeradius/3.0/mods-available/sql.template:ro
      - radius_logs:/var/log/freeradius

  # Web app reads FreeRADIUS logs from shared volume (read-only)
networks:
  safenet-network:
    driver: bridge

volumes:
  db_data:
    driver: local
  radius_logs:
    driver: local
