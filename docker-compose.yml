services:
  # MariaDB Database
  db:
    image: mariadb:10.11
    container_name: safenet-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-radius}
      MYSQL_USER: ${DB_USER:-radius}
      MYSQL_PASSWORD: ${DB_PASSWORD:-radiuspassword}
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    networks:
      - safenet-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # phpMyAdmin - Database Management Interface
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: safenet-phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: ${DB_USER:-radius}
      PMA_PASSWORD: ${DB_PASSWORD:-radiuspassword}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      UPLOAD_LIMIT: 300M
      MAX_EXECUTION_TIME: 600
    depends_on:
      db:
        condition: service_healthy
    networks:
      - safenet-network

  # Flask Web Application
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: safenet-web
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      FLASK_APP: app.py
      FLASK_ENV: ${FLASK_ENV:-production}
      SECRET_KEY: ${SECRET_KEY:-change-this-to-a-random-secret-key}
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-radius}
      DB_USER: ${DB_USER:-radius}
      DB_PASSWORD: ${DB_PASSWORD:-radiuspassword}
      RADIUS_SECRET: ${RADIUS_SECRET:-testing123}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@safenet.local}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - safenet-network
    command: >
      sh -c "
        echo 'Waiting for database...' &&
        sleep 10 &&
        flask init-db &&
        gunicorn --bind 0.0.0.0:5000 --workers 4 --timeout 120 app:app
      "

  # FreeRADIUS Server
  freeradius:
    build:
      context: .
      dockerfile: freeradius/Dockerfile
    container_name: safenet-radius
    restart: unless-stopped
    ports:
      - "1812:1812/udp"  # RADIUS Authentication
      - "1813:1813/udp"  # RADIUS Accounting
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-radius}
      DB_USER: ${DB_USER:-radius}
      DB_PASSWORD: ${DB_PASSWORD:-radiuspassword}
      RADIUS_SECRET: ${RADIUS_SECRET:-testing123}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - safenet-network
    volumes:
      - ./freeradius/clients.conf:/etc/freeradius/3.0/clients.conf:ro
      - ./freeradius/radiusd.conf:/etc/freeradius/3.0/radiusd.conf:ro
      - ./freeradius/mods-available/sql:/etc/freeradius/3.0/mods-available/sql:ro

networks:
  safenet-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  db_data:
    driver: local

