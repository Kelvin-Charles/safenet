{% extends "base.html" %}
{% from "auth/_field.html" import field %}

{% block title %}Reset password - {{ app_name }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-lg border-0">
            <div class="card-body p-5">
                <h3 class="fw-bold mb-3">Choose a new password</h3>
                <form method="POST" novalidate>
                    {{ form.hidden_tag() }}
                    {{ field(form.password) }}
                    {{ field(form.confirm) }}
                    <div class="d-grid"><button type="submit" class="btn btn-primary">Save password</button></div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
