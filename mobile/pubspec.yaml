name: safenet_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.12.2

dependencies:
  connectivity_plus: ^7.3.2
  fl_chart: ^1.3.0
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  google_fonts: ^8.2.1
  http: ^1.6.0
  intl: ^0.20.3
  provider: ^6.1.5+1
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png

# App icon: dart run flutter_launcher_icons  (artwork drawn in assets/brand/)
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/brand/icon.png
  remove_alpha_ios: true
  adaptive_icon_background: assets/brand/icon_bg.png
  adaptive_icon_foreground: assets/brand/icon_fg.png
  min_sdk_android: 21

# Launch screen: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#051D60"
  image: assets/brand/splash.png
  android_12:
    color: "#051D60"
    image: assets/brand/splash12.png
    icon_background_color: "#051D60"
  fullscreen: false
