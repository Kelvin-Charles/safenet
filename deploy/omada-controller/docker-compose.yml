# TP-Link Omada Software Controller, hosted for SafeNet tenants.
# Access points anywhere adopt to radius.safezonetz.com; SafeNet reaches the
# controller on 127.0.0.1:8043 for the external portal.
services:
  omada:
    image: mbentley/omada-controller:5.15
    container_name: omada-controller
    restart: unless-stopped
    stop_grace_period: 60s
    ulimits:
      nofile: { soft: 4096, hard: 8192 }
    environment:
      TZ: Africa/Dar_es_Salaam
      MANAGE_HTTP_PORT: "8088"
      MANAGE_HTTPS_PORT: "8043"
      PORTAL_HTTP_PORT: "8088"
      PORTAL_HTTPS_PORT: "8843"
      SHOW_SERVER_LOGS: "true"
      SHOW_MONGODB_LOGS: "false"
      # Same Let's Encrypt certificate as radius.safezonetz.com, imported at start (update_cert.sh)
      SSL_CERT_NAME: tls.crt
      SSL_KEY_NAME: tls.key
    network_mode: host   # docker has no free bridge networks here; ports 8088/8043/8843/29810-29817 are free
    volumes:
      - omada-data:/opt/tplink/EAPController/data
      - omada-logs:/opt/tplink/EAPController/logs
      - ./cert:/cert:ro
volumes:
  omada-data:
  omada-logs:
